services:
  postgres:
    image: postgres:18-alpine
    container_name: hornerodb-postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    env_file: .env
    ports:
      - 1411:1411
    volumes:
      - "./data:/app/data"
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
  hornerodb-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hornerodb-server
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=hornero
      - POCKETID_ISSUER_URL=http://pocket-id:1411
      - POCKETID_PUBLIC_URL=http://localhost:1411
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pocket-id:
        condition: service_healthy

volumes:
  postgres_data:
