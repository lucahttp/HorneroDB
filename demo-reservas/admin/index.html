<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - HorneroDB Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Login View -->
        <div id="login-view" class="view">
            <header>
                <h1>Admin Panel</h1>
                <p class="subtitle">Gestiona tu negocio con HorneroDB</p>
            </header>
            <div class="login-box">
                <button id="login-btn" class="btn btn-primary btn-block">
                    Iniciar Sesión con PocketID
                </button>
                <p class="hint">Solo usuarios autorizados del workspace.</p>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view hidden">
            <header class="header-row">
                <div>
                    <h1>Panel de Control</h1>
                    <p id="user-welcome"></p>
                </div>
                <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
            </header>

            <nav class="tabs">
                <button class="tab active" data-tab="turnos">Turnos</button>
                <button class="tab" data-tab="servicios">Servicios y Precios</button>
                <button class="tab" data-tab="usuarios">Usuarios</button>
            </nav>

            <main>
                <!-- Turnos Tab -->
                <div id="tab-turnos" class="tab-content">
                    <h2>Agenda de Turnos</h2>
                    <div class="table-wrapper">
                        <table id="turnos-table">
                            <thead>
                                <tr>
                                    <th>Horario</th>
                                    <th>Cliente</th>
                                    <th>Email</th>
                                    <th>Servicio</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- Servicios Tab -->
                <div id="tab-servicios" class="tab-content hidden">
                    <div class="section-header">
                        <h2>Gestión de Servicios</h2>
                        <button class="btn btn-sm btn-primary" onclick="showAddService()">+ Nuevo</button>
                    </div>
                    <div class="table-wrapper">
                        <table id="servicios-table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Precio</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- Usuarios Tab -->
                <div id="tab-usuarios" class="tab-content hidden">
                    <div class="section-header">
                        <h2>Miembros del Equipo</h2>
                        <button class="btn btn-sm btn-primary" onclick="showAddUser()">+ Agregar</button>
                    </div>
                    <div class="table-wrapper">
                        <table id="usuarios-table">
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="modal-title"></h3>
            <form id="modal-form">
                <div id="modal-fields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
